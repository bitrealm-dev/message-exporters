# Manually cut a semantic-versioned GitHub Release with platform ZIP archives.
# Does not run on push/PR — only via Actions → Release → Run workflow.
#
# Optional signing (no-op until the matching repo secrets are set):
#   Windows: WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD
#   macOS:   MACOS_CERTIFICATE_BASE64, MACOS_CERTIFICATE_PASSWORD,
#            MACOS_SIGNING_IDENTITY, NOTARY_APPLE_ID, NOTARY_TEAM_ID,
#            NOTARY_APP_SPECIFIC_PASSWORD
# See docs/maintainers/signing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
    steps:
      - id: semver
        env:
          RAW: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="${RAW#v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: ${RAW@Q} (expected e.g. 0.1.0)"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Will release tag v$V"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            artifact_suffix: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            artifact_suffix: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    # Job-level env so `if:` can detect whether signing secrets are configured
    # (secrets cannot be referenced directly in step `if` expressions).
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build --workspace --release
          cargo build --release -p message-ir --bin message-reexporter --features cli
          cargo build --release -p vault-push --features cli

      - name: Sign Windows binaries
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$(mktemp --suffix=.pfx)"
          cleanup() { rm -f "$CERT_PATH"; }
          trap cleanup EXIT
          echo "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          SIGNTOOL=""
          for candidate in \
            "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe \
            "/c/Program Files/Windows Kits/10/bin/"*/x64/signtool.exe
          do
            if [[ -f "$candidate" ]]; then
              SIGNTOOL="$candidate"
              break
            fi
          done
          if [[ -z "$SIGNTOOL" ]]; then
            echo "signtool.exe not found in Windows Kits" >&2
            exit 1
          fi
          echo "Using $SIGNTOOL"

          # Sign project binaries that ship in the ZIP (GUI + cli/).
          for bin in \
            message-exporters-gui \
            go-sms-pro-exporter \
            sms-backup-restore-exporter \
            sms-backup-plus-exporter \
            openextract-exporter \
            imazing-exporter \
            imessage-ir-exporter \
            whatsapp-exporter \
            message-reexporter \
            vault-push \
            contacts-validate \
            imazing-obfuscate
          do
            path="target/release/${bin}.exe"
            if [[ ! -f "$path" ]]; then
              echo "missing binary to sign: $path" >&2
              exit 1
            fi
            "$SIGNTOOL" sign \
              /f "$CERT_PATH" \
              /p "$WINDOWS_CERTIFICATE_PASSWORD" \
              /fd SHA256 \
              /tr http://timestamp.digicert.com \
              /td SHA256 \
              "$path"
          done

      - name: Sign and notarize macOS binaries
        if: matrix.os == 'macos-latest' && env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/message-exporters-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            rm -f "$CERT_PATH"
          }
          trap cleanup EXIT

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          for bin in \
            message-exporters-gui \
            go-sms-pro-exporter \
            sms-backup-restore-exporter \
            sms-backup-plus-exporter \
            openextract-exporter \
            imazing-exporter \
            imessage-ir-exporter \
            whatsapp-exporter \
            message-reexporter \
            vault-push \
            contacts-validate \
            imazing-obfuscate
          do
            path="target/release/${bin}"
            if [[ ! -f "$path" ]]; then
              echo "missing binary to sign: $path" >&2
              exit 1
            fi
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" "$path"
            codesign --verify --verbose "$path"
          done

          # Notarize the GUI (standalone Mach-O; stapling is not available without a
          # .app / .pkg / .dmg — Gatekeeper still checks online on first launch).
          NOTARY_ZIP="$RUNNER_TEMP/message-exporters-gui-notarize.zip"
          ditto -c -k --keepParent target/release/message-exporters-gui "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_APP_SPECIFIC_PASSWORD" \
            --wait
          rm -f "$NOTARY_ZIP"

      - name: Package platform ZIP
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package-release.sh
          scripts/package-release.sh \
            '${{ needs.validate.outputs.version }}' \
            '${{ matrix.artifact_suffix }}' \
            '${{ matrix.ext }}'

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.artifact_suffix }}
          path: dist/message-exporters-${{ needs.validate.outputs.version }}-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: package-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "$TAG" dist/*.zip \
            --title "message-exporters ${VERSION}" \
            --notes "Release ${VERSION} of Message Exporters.

          Download the ZIP for your platform, extract the whole archive into one folder, and keep every file together. Start the desktop app:

          - Linux: \`message-exporters-gui\`
          - Windows: \`message-exporters-gui.exe\`
          - macOS Apple Silicon: \`message-exporters-gui\`

          ### Archives

          - \`message-exporters-${VERSION}-x86_64-unknown-linux-gnu.zip\`
          - \`message-exporters-${VERSION}-x86_64-pc-windows-msvc.zip\`
          - \`message-exporters-${VERSION}-aarch64-apple-darwin.zip\`

          ### Layout

          - **ZIP root:** \`message-exporters-gui\`, WhatsApp \`wtsexporter\` 0.13.0, bundled \`ffmpeg\` / \`ffprobe\` (eugeneware/ffmpeg-static \`b6.1.1\`), and license notices. The GUI runs exporters as libraries; keep the helpers beside it.
          - **\`cli/\`:** standalone exporter CLIs, \`message-reexporter\`, \`vault-push\`, \`contacts-validate\`, and \`imazing-obfuscate\`.

          ### Notes

          - Builds are unsigned until code-signing secrets are configured (see \`docs/maintainers/signing.md\`). Windows SmartScreen and macOS Gatekeeper may warn on first launch; allow the app once if you trust the download.
          - See \`THIRD_PARTY_NOTICES.md\` in each archive for bundled helper provenance and licenses."
