[package]
name = "message-ir"
version = "0.1.0"
edition = "2024"
description = "Common-message ConversationDocument and CSV/EML/MBOX/JSON/SBR-XML projectors"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.103"
csv = "1.4.0"
message-csv = { path = "../message-csv" }
message-exporters-core = { path = "../message-exporters-core" }
message-mail = { path = "../message-mail" }
message-media = { path = "../message-media" }
message-obfuscate = { path = "../message-obfuscate" }
message-sbr = { path = "../message-sbr" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
