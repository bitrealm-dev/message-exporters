[package]
name = "message-reexporter"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "message-reexporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"], optional = true }
csv = "1.4.0"
message-exporters-core = { path = "../message-exporters-core" }
message-ir = { path = "../message-ir" }
message-media = { path = "../message-media" }
sms-backup-restore-exporter = { path = "../sms-backup-restore-exporter" }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
