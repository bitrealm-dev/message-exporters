[package]
name = "message-exporters-web"
version = "0.1.0"
edition = "2024"
description = "Local browser-based GUI for message-exporters (additive alternative to message-exporters-gui)"

[dependencies]
axum = { version = "0.8", features = ["query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
askama = "0.14"
askama_web = { version = "0.14", features = ["axum-0.8"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
open = "5"

go-sms-pro-exporter = { path = "../go-sms-pro-exporter", default-features = false }
imazing-exporter = { path = "../imazing-exporter", default-features = false }
imessage-ir-exporter = { path = "../imessage-ir-exporter" }
openextract-exporter = { path = "../openextract-exporter", default-features = false }
sms-backup-plus-exporter = { path = "../sms-backup-plus-exporter", default-features = false }
sms-backup-restore-exporter = { path = "../sms-backup-restore-exporter", default-features = false }
whatsapp-exporter = { path = "../whatsapp-exporter", default-features = false }
message-contacts = { path = "../message-contacts" }
message-exporters-core = { path = "../message-exporters-core" }
message-ir = { path = "../message-ir", default-features = false }
message-media = { path = "../message-media" }
message-phone = { path = "../message-phone" }
vault-push = { path = "../vault-push", default-features = false }
