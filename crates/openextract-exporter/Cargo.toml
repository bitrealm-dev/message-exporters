[package]
name = "openextract-exporter"
version = "0.1.0"
edition = "2024"
description = "Convert OpenExtract conversation CSV (+ VCF) to shared per-chat CSV"
autotests = false

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "openextract-exporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"], optional = true }
csv = "1.4.0"
message-obfuscate = { path = "../message-obfuscate" }
message-contacts = { path = "../message-contacts" }
message-csv = { path = "../message-csv" }
message-exporters-core = { path = "../message-exporters-core" }
message-ir = { path = "../message-ir" }
message-media = { path = "../message-media" }
message-phone = { path = "../message-phone" }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
