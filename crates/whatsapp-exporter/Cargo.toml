[package]
name = "whatsapp-exporter"
version = "0.1.0"
edition = "2024"
description = "Convert WhatsApp DB/backup via wtsexporter JSON to shared per-chat CSV"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "whatsapp-exporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"], optional = true }
hex = "0.4.3"
message-obfuscate = { path = "../message-obfuscate" }
message-csv = { path = "../message-csv" }
message-exporters-core = { path = "../message-exporters-core" }
message-ir = { path = "../message-ir" }
message-media = { path = "../message-media" }
message-phone = { path = "../message-phone" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
