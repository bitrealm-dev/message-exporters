[package]
name = "imazing-exporter"
version = "0.1.0"
edition = "2024"
description = "Convert iMazing Messages / WhatsApp CSV (+ Contacts CSV) to shared per-chat CSV"
autotests = false

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "imazing-exporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"], optional = true }
csv_io = { package = "csv", version = "1.4.0" }
hex = "0.4.3"
obfuscate = { path = "../../message/obfuscate" }
contacts = { path = "../../message/contacts" }
csv = { path = "../../message/csv" }
message-exporters-core = { path = "../../message-exporters-core" }
ir = { path = "../../message/ir" }
media = { path = "../../message/media" }
phone = { path = "../../message/phone" }
serde_json = "1.0.150"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
