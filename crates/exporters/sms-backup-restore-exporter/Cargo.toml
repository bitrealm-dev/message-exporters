[package]
name = "sms-backup-restore-exporter"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "sms-backup-restore-exporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"], optional = true }
contacts = { path = "../../message/contacts" }
csv = { path = "../../message/csv" }
message-exporters-core = { path = "../../message-exporters-core" }
ir = { path = "../../message/ir" }
media = { path = "../../message/media" }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
