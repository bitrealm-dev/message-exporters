# Message Exporters GUI — export options
# Copy to export.ini in the working directory (or next to the GUI binary).
# The GUI loads export.ini on start and saves it on Run / exit.
# Keys match the Export tab; unused keys for a given backup type are ignored.
# Backup passwords are never written.

[common]
# Active backup type section: go-sms-pro | sms-backup-restore | sms-backup-plus |
# openextract | imazing | iphone-backup | whatsapp
exporter = go-sms-pro

# --- Message filtering ---
start_date =          # YYYY-MM-DD inclusive (local midnight)
end_date =            # YYYY-MM-DD exclusive (local midnight)
obfuscate = false
# Exactly 8 hex chars; leave empty to generate at run time.
# Example seed for reproducible demos:
obfuscate_seed = 01234567

# --- Your phone number(s) ---
# Used by GO SMS Pro, SMS Backup & Restore, SMS Backup+. Separate with \n or commas.
owner_phones =
# +15555550100

# --- Contacts file ---
# VCF or iMazing Contacts CSV. Leave empty if unused.
# Ignored for iPhone backup (use apple_contacts) and WhatsApp (use [whatsapp] wa).
contacts =

# --- Output format ---
# Honored by SMS Backup & Restore and iPhone backup. Other sources always write CSV.
output_format = csv   # csv | eml

# --- Attachments ---
# Not used by OpenExtract. Convert/compress need ffmpeg/ffprobe.
attachment_media = clone   # disabled | clone | convert | compress
media_max_resolution = 1080p   # 720p | 1080p | 4k (compress only)
media_max_fps = 30
media_min_size = 20M
media_skip_efficient = true

[go-sms-pro]
# GO SMS Pro backup folder (XML + PDU)
input =
output =

[sms-backup-restore]
# SMS Backup & Restore XML file, or folder of XML files
input =
output =

[sms-backup-plus]
# Folder of .eml files (or one .eml)
input =
output =
# Separate with \n or commas (required for this converter)
owner_emails =
# name@example.com
# Phone,Incorrect Name CSV; defaults to crate config/name-mapping.csv when present
name_mapping =

[openextract]
# Conversation CSV file or folder (conversation_*.csv / all_conversations.csv)
input =
output =

[imazing]
# Messages/WhatsApp CSV, chat folder, or device export root
input =
output =
# IANA timezone or UTC offset for naive Message Date (empty = host local)
timezone =

[iphone-backup]
# Database / iOS backup path (chat.db or backup folder)
input =
output =
apple_platform = auto   # auto | macos | ios
# Optional AddressBook DB (advanced)
apple_contacts =
# Optional attachment root override (advanced)
attachment_root =
# Optional conversation filter (advanced)
conversation_filter =

[whatsapp]
# No GUI Input field — wtsexporter uses the GUI launch working directory.
output =
platform = android   # android | ios
# Advanced (GUI): backup / wa / media / db / business (iOS requires backup)
backup =
wa =
media =
db =
business = false
# Android decryption key / crypt15 hex is never written to this file.
