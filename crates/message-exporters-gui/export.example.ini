# Message Exporters GUI — export options skeleton
# Example/template only (not loaded by the app yet).
# Keys match the Export tab; unused keys for a given backup type are ignored.

[common]
# --- Message filtering ---
start_date =          # YYYY-MM-DD inclusive (local midnight)
end_date =            # YYYY-MM-DD exclusive (local midnight)
anonymize = false
# 64-char hex; leave empty to generate at run time.
# Skeleton default for reproducible demos:
anonymize_seed = 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

# --- Your phone number(s) ---
# Used by GO SMS Pro, SMS Backup & Restore, SMS Backup+. One number per line.
owner_phones =
# +15555550100

# --- Contacts file ---
# VCF or iMazing Contacts CSV. Leave empty if unused.
# Ignored for iPhone backup (use apple_contacts there instead).
contacts =

# --- Attachments ---
# Not used by OpenExtract. Convert/compress need ffmpeg/ffprobe.
attachment_media = clone   # disabled | clone | convert | compress
media_max_resolution = 1080p   # 720p | 1080p | 4k (compress only)
media_max_fps = 30
media_min_size = 20M
media_skip_efficient = true

[go-sms-pro]
# GO SMS Pro backup folder (XML + PDU)
input =
output =

[sms-backup-restore]
# SMS Backup & Restore XML file, or folder of XML files
input =
output =

[sms-backup-plus]
# Folder of .eml files (or one .eml)
input =
output =
# One address per line (required for this converter)
owner_emails =
# name@example.com
# Optional override; defaults to config/name-mapping.csv when present
name_mapping =

[openextract]
# Conversation CSV file or folder (conversation_*.csv / all_conversations.csv)
input =
output =

[imazing]
# Messages/WhatsApp CSV, chat folder, or device export root
input =
output =
# IANA timezone for naive Message Date (empty = host local)
timezone =

[iphone-backup]
# Database / iOS backup path (chat.db or backup folder)
input =
output =
backup_password =
apple_platform = auto   # auto | macos | ios
# Optional AddressBook DB (advanced)
apple_contacts =
# Optional attachment root override (advanced)
attachment_root =
# Optional conversation filter (advanced)
conversation_filter =
