[package]
name = "imessage-mail-exporter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Export iMessage data to per-conversation .eml mail archives via imessage-database"
repository = "https://github.com/bitrealm-dev/message-exporters"

[lib]
name = "imessage_mail_exporter"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.44"
crabapple = { version = "=0.4.7" }
imessage-database = "4.2.0"
message-csv = { path = "../message-csv" }
message-exporters-core = { path = "../message-exporters-core" }
message-mail = { path = "../message-mail" }
rpassword = "=7.5.3"
rusqlite = { version = "=0.40.0", features = ["blob", "bundled"] }
