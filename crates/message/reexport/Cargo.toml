[package]
name = "message-reexport"
version = "0.1.0"
edition = "2024"
description = "Convert a Message Exporters output directory to another format"
license = "MIT OR Apache-2.0"

[[bin]]
name = "message-reexporter"
path = "src/bin/message_reexporter.rs"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
message-exporter-core = { path = "../../message-exporter-core" }
message-ir = { path = "../ir" }
message-ir-format = { path = "../ir-format" }
media = { path = "../media" }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
