[package]
name = "ir"
version = "0.1.0"
edition = "2024"
description = "Common-message ConversationDocument and CSV/EML/MBOX/JSON/SBR-XML projectors"
license = "MIT OR Apache-2.0"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "message-reexporter"
path = "src/bin/message_reexporter.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"], optional = true }
csv_io = { package = "csv", version = "1.4.0" }
csv = { path = "../csv" }
message-exporters-core = { path = "../../message-exporters-core" }
mail = { path = "../mail" }
media = { path = "../media" }
obfuscate = { path = "../obfuscate" }
phone = { path = "../phone" }
sbr = { path = "../sbr" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
