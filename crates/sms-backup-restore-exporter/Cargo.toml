[package]
name = "sms-backup-restore-exporter"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "sms-backup-restore-exporter"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"], optional = true }
csv = "1.4.0"
hex = "0.4.3"
html-escape = "0.2.14"
message-obfuscate = { path = "../message-obfuscate" }
message-contacts = { path = "../message-contacts" }
message-csv = { path = "../message-csv" }
message-exporters-core = { path = "../message-exporters-core" }
message-ir = { path = "../message-ir" }
message-media = { path = "../message-media" }
message-phone = { path = "../message-phone" }
quick-xml = { version = "0.41.0", features = ["serialize"] }
regex = "1.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
